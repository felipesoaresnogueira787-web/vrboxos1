name: Build VR BOX OS

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extrair projeto
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ERRO: Nenhum arquivo ZIP encontrado na raiz."
            exit 1
          fi
          mkdir projeto
          unzip -q "$ZIP" -d projeto
          echo "Estrutura do projeto:"
          find projeto -maxdepth 4 -type f | head -200

      - name: Localizar projeto Gradle
        id: localizar
        run: |
          ROOT=$(find projeto -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$ROOT" ]; then
            echo "ERRO: settings.gradle ou settings.gradle.kts não encontrado."
            exit 1
          fi
          echo "diretorio=$(dirname "$ROOT")" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        working-directory: ${{ steps.localizar.outputs.diretorio }}
        run: gradle assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: VR-BOX-OS-APK
          path: projeto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
          
